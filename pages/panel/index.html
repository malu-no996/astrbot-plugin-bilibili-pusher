<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>B 站面板</title>
    <link rel="stylesheet" href="./style.css" />
    <!-- bridge 必须先于所有业务脚本加载（经典脚本立即执行，不能等服务端在 </body> 前追加）；
         服务端会把这行改写成带鉴权参数的真实地址 -->
    <script src="/api/plugin/page/bridge-sdk.js"></script>
  </head>
  <body>
    <div id="app">
      <header class="top">
        <h1>B 站面板 <span class="hint">扫码登录 · 私信 · 关注 · 动态 · 直播 · 订阅推送</span></h1>
        <span id="login-badge" class="badge offline">读取中…</span>
      </header>
      <nav class="tabs" id="tabs"></nav>
      <main id="view"></main>
      <div id="modal"></div>
      <div id="toasts"></div>
    </div>
    <!-- 按序加载：core（公共）→ 各子页签 → 弹窗 → 入口 -->
    <script src="./js/core.js"></script>
    <script src="./js/account.js"></script>
    <script src="./js/dm.js"></script>
    <script src="./js/follow.js"></script>
    <script src="./js/feed.js"></script>
    <script src="./js/lives.js"></script>
    <script src="./js/subs.js"></script>
    <script src="./js/livesubs.js"></script>
    <script src="./js/modals.js"></script>
    <script src="./js/cmds.js"></script>
    <script src="./js/data.js"></script>
    <script src="./js/main.js"></script>
  </body>
</html>
