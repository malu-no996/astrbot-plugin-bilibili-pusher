<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>命令配置</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div class="wrap">
      <header>
        <h1>命令配置</h1>
        <span id="saveState" class="muted"></span>
      </header>

      <p class="muted hint">
        两条订阅命令走「群消息监听」实现，触发词改完保存立即生效（不用重启）。
        群内发送触发词即可命中，兼容前面带 <code>@机器人</code> 或 <code>/</code> 的写法；
        触发词后面跟 UP 主 UID（纯数字或 space 主页链接）。
      </p>

      <section id="cmdCards"></section>

      <section>
        <h2>内置命令（固定，仅管理员）</h2>
        <p class="muted">这三条由 AstrBot 命令系统静态注册，别名/权限改不了，只作展示。</p>
        <table>
          <thead>
            <tr><th>命令</th><th>别名</th><th>说明</th><th>用法</th></tr>
          </thead>
          <tbody id="staticRows"></tbody>
        </table>
      </section>

      <div class="actions">
        <button id="save" class="primary">保存配置</button>
        <button id="reload" class="ghost">重新加载</button>
      </div>
    </div>
    <script type="module" src="./app.js"></script>
  </body>
</html>
